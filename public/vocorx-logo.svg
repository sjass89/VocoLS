<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1DE9B6" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1DE9B6" />
      <stop offset="70%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .brand-title {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 68px;
      letter-spacing: -1.5px;
    }
    .brand-subtitle {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 13.5px;
      letter-spacing: 0.28em;
      fill: #A1AAB3;
    }
  </style>

  <!-- Icon Mark (Cyan Hexagon / Shield with Stylized Pulse 'V') -->
  <g transform="translate(20, 20)">
    <!-- Base Icon Container -->
    <rect width="120" height="120" rx="28" fill="#0B1224" stroke="url(#brandGrad)" stroke-width="2.5" />
    
    <!-- Neon Voice Pulse V -->
    <path d="M36 40 L60 88 L84 40" fill="none" stroke="url(#brandGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyanGlow)" />
    
    <!-- Central Soundwave Dot -->
    <circle cx="60" cy="50" r="4.5" fill="#00E5FF" />
  </g>

  <!-- Typographic Wordmark -->
  <g transform="translate(165, 88)">
    <text class="brand-title">
      <tspan fill="url(#brandGrad)">Voco</tspan>
      <tspan fill="#FFFFFF" dx="2">Rx</tspan>
    </text>

    <!-- Rx Dynamic Gradient Slash -->
    <rect x="238" y="-38" width="46" height="5.5" rx="2.75" fill="url(#slashGrad)" transform="rotate(-18, 238, -38)" filter="url(#cyanGlow)" />

    <!-- Tagline Subtitle -->
    <text x="4" y="34" class="brand-subtitle">VOICE AI FOR PHARMACIES</text>
  </g>
</svg>
